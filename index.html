<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Theo's Sydney</title>
<meta name="theme-color" content="#fcfcfa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Doodle+Shadow&family=Patrick+Hand&family=Gochi+Hand&display=swap">
<link rel="stylesheet" href="app.css">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body data-mode="theo">
<div class="app">
  <header class="top">
    <svg class="doodle" viewBox="0 0 40 40" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 5a14 14 0 1 0 11 22A11 11 0 0 1 24 5z"/><path d="M31 6l1.2 3.4 3.4 1.2-3.4 1.2L31 15.2l-1.2-3.4-3.4-1.2 3.4-1.2z"/><circle cx="36" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.2"/></g></svg>
    <div class="ttl"><h1>Theo's Sydney</h1><div class="from">a quest from the Coven &amp; Co.</div></div>
    <div class="meta"><b id="count">0 / 0</b>spells unlocked</div>
  </header>

  <div class="mapwrap" id="mapwrap">
    <svg id="map" role="img" aria-label="Hand-drawn map of Sydney with Theo's quest spots">
      <defs>
        <pattern id="waves" width="30" height="22" patternUnits="userSpaceOnUse">
          <path d="M3 7q3-3.5 6 0t6 0M18 18q3-3.5 6 0t6 0" fill="none" stroke="#151514" stroke-width="1.3" stroke-linecap="round" opacity=".5"/>
        </pattern>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="#fcfcfa"/><line x1="0" y1="0" x2="0" y2="6" stroke="#151514" stroke-width="1.4" opacity=".55"/>
        </pattern>
        <symbol id="i-cafe" viewBox="0 0 24 24"><path class="ico" d="M4 9.5h12v4.5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 10.5h1.8a2.6 2.6 0 0 1 0 5.2H16M8 3.5c-1.2 1.4 1.1 2.2 0 4M12 3.5c-1.2 1.4 1.1 2.2 0 4"/></symbol>
        <symbol id="i-bar" viewBox="0 0 24 24"><path class="ico" d="M4 4.5h16L12 13zM12 13v7M8 20.5h8M18 2.5l-4.5 5"/><circle class="ico" cx="14.6" cy="6.6" r="1.4"/></symbol>
        <symbol id="i-swim" viewBox="0 0 24 24"><path class="ico" d="M2.5 8c2.4-2 4.6-2 7 0s4.6 2 7 0 4.4-2 5 0M2.5 13c2.4-2 4.6-2 7 0s4.6 2 7 0 4.4-2 5 0M2.5 18c2.4-2 4.6-2 7 0s4.6 2 7 0 4.4-2 5 0"/></symbol>
        <symbol id="i-yoga" viewBox="0 0 24 24"><path class="ico" d="M12 4.5c-2.6 3-2.6 7 0 10.5 2.6-3.5 2.6-7.5 0-10.5zM12 15c-3.4-.4-6.4-2.6-7.5-6.2 3.2.1 6.2 2.3 7.5 6.2zM12 15c3.4-.4 6.4-2.6 7.5-6.2-3.2.1-6.2 2.3-7.5 6.2zM4 19h16"/></symbol>
        <symbol id="i-massage" viewBox="0 0 24 24"><ellipse class="ico" cx="12" cy="18" rx="7.5" ry="2.6"/><ellipse class="ico" cx="12" cy="12.6" rx="5.4" ry="2.3"/><ellipse class="ico" cx="12" cy="7.8" rx="3.4" ry="1.9"/><path class="ico" d="M17 3.5c2.5.2 3.5 1.6 3.5 3.5-2.4 0-3.6-1.4-3.5-3.5z"/></symbol>
        <symbol id="i-sunset" viewBox="0 0 24 24"><path class="ico" d="M2.5 17h19M6.8 17a5.2 5.2 0 0 1 10.4 0M12 5.5v2.3M5.4 9.4l1.6 1.6M18.6 9.4 17 11M2.8 13.6h2.3M18.9 13.6h2.3M7 20.5h10"/></symbol>
        <symbol id="i-thrift" viewBox="0 0 24 24"><path class="ico" d="M10 6.2a2.1 2.1 0 1 1 2 2.1v1.6L3.4 16.3a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8L12 9.9"/></symbol>
        <symbol id="i-gift" viewBox="0 0 24 24"><path class="ico" d="M4.5 11h15v9.5h-15zM3 7.5h18V11H3zM12 7.5v13M12 7.5C10.5 3.5 6 3.8 7.5 7M12 7.5c1.5-4 6-3.7 4.5-.5"/></symbol>
        <symbol id="i-crystal" viewBox="0 0 24 24"><path class="ico" d="M8 3.5h8l4 5.5-8 12-8-12zM4 9h16M9 9l3 11.5L15 9M8 3.5 9 9M16 3.5 15 9"/></symbol>
        <symbol id="i-book" viewBox="0 0 24 24"><path class="ico" d="M12 6.5C10 5 7 4.5 3 5v13c4-.5 7 0 9 1.5 2-1.5 5-2 9-1.5V5c-4-.5-7 0-9 1.5zM12 6.5v13"/></symbol>
        <symbol id="i-cinema" viewBox="0 0 24 24"><path class="ico" d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4zM9 7.5v1.5M9 11.2v1.6M9 15v1.5M14.5 9.5l.8 1.6 1.7.2-1.2 1.2.3 1.7-1.6-.8-1.6.8.3-1.7-1.2-1.2 1.7-.2z"/></symbol>
        <symbol id="i-art" viewBox="0 0 24 24"><path class="ico" d="M12 3a9 9 0 1 0 0 18c1.6 0 2.1-1.1 1.5-2.1-.6-1.1 0-2.4 1.5-2.4H17a4 4 0 0 0 4-4C21 7 17 3 12 3z"/><circle class="ico" cx="7.6" cy="11" r="1.2"/><circle class="ico" cx="9.6" cy="7" r="1.2"/><circle class="ico" cx="14.2" cy="6.6" r="1.2"/><circle class="ico" cx="17" cy="10" r="1.2"/></symbol>
        <symbol id="i-market" viewBox="0 0 24 24"><path class="ico" d="M3 9.5 5 4.5h14l2 5M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M5 11.5v8.5h14v-8.5M10 20v-4.5h4V20"/></symbol>
        <symbol id="i-ferry" viewBox="0 0 24 24"><path class="ico" d="M3 14.5 5 18h14l2-3.5zM6 14.5V10h12v4.5M9 10V7h6v3M2.5 21c2 1 3.5 1 5 0s3-1 5 0 3.5 1 5 0 3-1 4 0"/></symbol>
        <symbol id="i-heart" viewBox="0 0 24 24"><path class="ico" d="M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.2 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path class="ico" d="M15 3.5a8.5 8.5 0 1 0 6 13.5A7 7 0 0 1 15 3.5z"/><path class="ico" d="M19.5 3.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7.5 11V8.2a4.5 4.5 0 0 1 9 0V11" fill="none" stroke="#151514" stroke-width="2.4" stroke-linecap="round"/><rect x="5" y="11" width="14" height="10" rx="2.2" fill="#fcfcfa" stroke="#151514" stroke-width="2.4"/><circle cx="12" cy="15.4" r="1.4" fill="#151514"/><path d="M12 16.4v2" stroke="#151514" stroke-width="1.8" stroke-linecap="round"/></symbol>
        <symbol id="i-tick" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fcfcfa" stroke="#151514" stroke-width="2.4"/><path d="M7.5 12.5l3 3 6-7" fill="none" stroke="#151514" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-chat" viewBox="0 0 24 24"><path class="ico" d="M4 5h16v11H10l-5 4v-4H4z"/><path class="ico" d="M8 9.5h8M8 12.5h5"/></symbol>
      </defs>
      <g id="world"></g>
    </svg>
    <div class="mapbtns">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">&minus;</button>
      <button id="zall" aria-label="Show all of Sydney"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="#151514" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="placebar" id="placebar" hidden>Tap the map where your spot is <button id="placecancel">Cancel</button></div>
    <div class="status" id="status"></div>
  </div>

  <main class="panel" id="panel" aria-live="polite"></main>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>


<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

<script src="app.js"></script>
</body></html>
